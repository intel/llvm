name: 'Run UR Tests'

inputs:
  test_type:
    description: 'Type of tests to run (adapter-specific or conformance)'
    required: true
  build_dir:
    required: false
    default: 'build'
  artifact_name:
    description: 'Name for uploaded test artifacts (logs, XML)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
  - name: Run ${{ inputs.test_type }} tests
    id: run_tests
    continue-on-error: true
    shell: bash
    env:
      BUILD_DIR: ${{ inputs.build_dir }}
      TEST_TYPE: ${{ inputs.test_type }}
    run: |
      # Run tests via Python (handles validation, config, cmake execution)
      # Use temp file instead of command substitution to preserve outputs even on error
      OUTPUTS_FILE=$(mktemp)
      set +e  # Don't exit on error
      python3 -u devops/scripts/ur_ci_utils.py run-tests "$TEST_TYPE" "$BUILD_DIR" "$GITHUB_WORKSPACE" > "$OUTPUTS_FILE" 2>&1
      EXIT_CODE=$?
      set -e  # Re-enable exit on error

      echo "Debug: Captured output file size: $(wc -l < "$OUTPUTS_FILE") lines"
      echo "Debug: Outputs in file:"
      grep -E "^(log_file|xml_file|xml_search_path|skip_artifacts)=" "$OUTPUTS_FILE" || echo "Warning: No outputs found"

      # Parse Python output and set GitHub Actions outputs (not env for security)
      while IFS='=' read -r key value; do
        if [ -n "$key" ] && [ -n "$value" ]; then
          echo "$key=$value" >> $GITHUB_OUTPUT
          echo "  Set output: $key=$value"
        fi
      done < <(grep -E "^(log_file|xml_file|xml_search_path|skip_artifacts)=" "$OUTPUTS_FILE")

      rm -f "$OUTPUTS_FILE"
      exit $EXIT_CODE

  - name: Filter test log
    if: ${{ always() }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs.log_file }}
    run: |
      if [ ! -f "$LOG_FILE" ]; then
        echo "::warning::Test log not found"
        exit 0
      fi

      echo "::group::Full Test Log"
      python3 devops/scripts/ur_test_summary.py filter-log "$LOG_FILE" || { echo "::error::Filter failed"; head -1000 "$LOG_FILE"; }
      echo "::endgroup::"

  - name: Report test failures
    if: steps.run_tests.outcome != 'success'
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs.log_file }}
    run: |
      python3 devops/scripts/ur_test_summary.py extract-errors "$LOG_FILE"
      exit 1

  - name: Test summary
    if: ${{ always() }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs.log_file }}
      XML_FILE: ${{ steps.run_tests.outputs.xml_file }}
    run: |
      if [ ! -f "$LOG_FILE" ]; then
        echo "::warning::Test log not found"
        exit 0
      fi

      if [ ! -s "$LOG_FILE" ]; then
        echo "::warning::Test log is empty"
        exit 0
      fi

      python3 devops/scripts/ur_test_summary.py show-summary "$LOG_FILE" "${XML_FILE:-}"

  - name: Copy artifacts
    if: ${{ always() && inputs.artifact_name != '' && (inputs.test_type != 'adapter-specific' || steps.run_tests.outputs.skip_artifacts != '1') }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs.log_file }}
      XML_FILE: ${{ steps.run_tests.outputs.xml_file }}
    run: |
      set -f  # Disable glob expansion

      # Clean artifacts directory to avoid mixing files from different test runs
      rm -rf test_artifacts
      mkdir -p test_artifacts

      if [ -f "$LOG_FILE" ]; then
        cp "$LOG_FILE" test_artifacts/
      fi

      echo "Debug: XML_FILE=$XML_FILE"
      echo "Debug: Checking if file exists..."
      if [ -n "$XML_FILE" ] && [ -f "$XML_FILE" ]; then
        echo "Debug: File exists, copying..."
        cp "$XML_FILE" test_artifacts/
      else
        echo "Debug: XML_FILE is empty or file does not exist"
        if [ -n "$XML_FILE" ]; then
          echo "Debug: Expected XML at: $XML_FILE"
          echo "Debug: Parent directory contents:"
          ls -la "$(dirname "$XML_FILE")" 2>/dev/null || echo "Parent directory does not exist"
        fi
      fi

      echo "Debug: Contents of test_artifacts/:"
      ls -la test_artifacts/

  - name: Upload test artifacts
    if: ${{ always() && inputs.artifact_name != '' && (inputs.test_type != 'adapter-specific' || steps.run_tests.outputs.skip_artifacts != '1') }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
    with:
      name: ${{ inputs.artifact_name }}
      path: test_artifacts/
      retention-days: 7
      if-no-files-found: warn
