name: 'Run UR Tests'

inputs:
  test_type:
    description: 'Type of tests to run (adapter-specific or conformance)'
    required: true
  build_dir:
    required: false
    default: 'build'
  artifact_name:
    description: 'Name for uploaded test artifacts (logs, XML)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
  - name: Run ${{ inputs.test_type }} tests
    id: run_tests
    continue-on-error: true
    shell: bash
    env:
      BUILD_DIR: ${{ inputs.build_dir }}
      TEST_TYPE: ${{ inputs.test_type }}
    run: |
      # Run tests via Python (handles validation, config, cmake execution)
      # Use temp file instead of command substitution to preserve outputs even on error
      OUTPUTS_FILE=$(mktemp)
      set +e  # Don't exit on error
      python3 -u devops/scripts/ur_ci_utils.py run-tests "$TEST_TYPE" "$BUILD_DIR" "$GITHUB_WORKSPACE" > "$OUTPUTS_FILE" 2>&1
      EXIT_CODE=$?
      set -e  # Re-enable exit on error

      # Parse Python output and set GitHub Actions outputs (not env for security)
      while IFS='=' read -r key value; do
        if [ -n "$key" ] && [ -n "$value" ]; then
          echo "$key=$value" >> $GITHUB_OUTPUT
          echo "  Set output: $key=$value"
        fi
      done < <(grep -E "^(log-file|xml-file|skip-artifacts)=" "$OUTPUTS_FILE")

      rm -f "$OUTPUTS_FILE"
      exit $EXIT_CODE

  - name: Filter test log
    if: ${{ always() }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs['log-file'] || 'adapter_tests.log' }}
    run: |
      if [ ! -f "$LOG_FILE" ]; then
        echo "::warning::Test log not found"
        exit 0
      fi

      echo "::group::Test Log"
      python3 devops/scripts/ur_test_summary.py filter-log "$LOG_FILE" || { echo "::error::Filter failed"; head -1000 "$LOG_FILE"; }
      echo "::endgroup::"

  - name: Report test failures
    if: steps.run_tests.outcome != 'success'
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs['log-file'] || 'adapter_tests.log' }}
    run: |
      python3 devops/scripts/ur_test_summary.py extract-errors "$LOG_FILE"
      exit 1

  - name: Test summary
    if: ${{ always() }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs['log-file'] || 'adapter_tests.log' }}
      XML_FILE: ${{ steps.run_tests.outputs['xml-file'] || 'adapter_tests_results.xml' }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    run: |
      if [ ! -f "$LOG_FILE" ]; then
        echo "::warning::Test log not found"
        exit 0
      fi

      if [ ! -s "$LOG_FILE" ]; then
        echo "::warning::Test log is empty"
        exit 0
      fi

      python3 devops/scripts/ur_test_summary.py show-summary "$LOG_FILE" "${XML_FILE:-}"

      # Add link to artifacts if they will be uploaded
      if [ -n "$ARTIFACT_NAME" ]; then
        echo ""
        echo "---"
        echo ""
        echo "Test artifacts (full logs, XML) will be available at:"
        echo "$WORKFLOW_URL"
      fi

  - name: Copy artifacts
    if: ${{ always() && inputs.artifact_name != '' && (inputs.test_type != 'adapter-specific' || steps.run_tests.outputs['skip-artifacts'] != '1') }}
    shell: bash
    env:
      LOG_FILE: ${{ steps.run_tests.outputs['log-file'] || 'adapter_tests.log' }}
      XML_FILE: ${{ steps.run_tests.outputs['xml-file'] || 'adapter_tests_results.xml' }}
    run: |
      set -f  # Disable glob expansion

      # Clean artifacts directory to avoid mixing files from different test runs
      rm -rf test_artifacts
      mkdir -p test_artifacts

      if [ -f "$LOG_FILE" ]; then
        cp "$LOG_FILE" test_artifacts/
      fi

      if [ -n "$XML_FILE" ] && [ -f "$XML_FILE" ]; then
        cp "$XML_FILE" test_artifacts/
      fi

  - name: Upload test artifacts
    if: ${{ always() && inputs.artifact_name != '' && (inputs.test_type != 'adapter-specific' || steps.run_tests.outputs['skip-artifacts'] != '1') }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
    with:
      name: ${{ inputs.artifact_name }}
      path: test_artifacts/
      retention-days: 7
      if-no-files-found: warn
