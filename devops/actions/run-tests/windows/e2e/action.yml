name: 'Run SYCL E2E tests on Windows'

inputs:
  ref:
    required: false
  binaries_artifact:
    required: false
  testing_mode:
    required: true
  extra_cmake_args:
    required: false
  target_devices:
    required: false
    default: all
  extra_lit_opts:
    required: false
  retention-days:
    required: false
  sycl_compiler:
    required: false
  cxx:
    required: false
    default: "cl"
  job_name:
    description: 'Name of the calling job, used to build a unique artifact name'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
  - name: Checkout E2E tests
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    with:
      path: llvm
      ref: ${{ inputs.ref || github.sha }}
      sparse-checkout: |
        llvm/utils/lit
        sycl/test-e2e
  - name: Download E2E Binaries
    if: inputs.testing_mode == 'run-only'
    uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
    with:
      name: ${{ inputs.binaries_artifact }}
  - name: Extract E2E Binaries
    if: inputs.testing_mode == 'run-only'
    shell: bash
    env:
      BINARIES_ARTIFACT: ${{ inputs.binaries_artifact }}
    run: |
      mkdir build-e2e
      tar -xf e2e_bin.tar.gz -C build-e2e
      if [ -z "$(find build-e2e -path '*/Output/*' -type f -print -quit)" ]; then
        echo "::error::Downloaded E2E binaries artifact '$BINARIES_ARTIFACT' has no compiled test binaries under */Output/ (likely produced by a failed upstream build job). Failing fast instead of running thousands of doomed tests."
        exit 1
      fi

  - name: Deduce E2E CMake options
    id: cmake_opts
    shell: bash
    env:
      CMAKE_EXTRA_ARGS: ${{ inputs.extra_cmake_args }}
    run: |
      if [ -n "$CMAKE_EXTRA_ARGS" ]; then
        echo "opts=$CMAKE_EXTRA_ARGS" >> $GITHUB_OUTPUT
      fi

  - name: Make E2E folder
    if: inputs.testing_mode != 'run-only'
    shell: bash
    run: |
      mkdir build-e2e

  - name: Configure E2E tests
    shell: bash
    run: |
      cmake -GNinja -B build-e2e -S./llvm/sycl/test-e2e -DCMAKE_CXX_COMPILER="${{ inputs.sycl_compiler || '$(which dpclang++).exe' }}" -DLEVEL_ZERO_LIBS_DIR="D:\\github\\level-zero_win-sdk\\lib" -DLEVEL_ZERO_INCLUDE="D:\\github\\level-zero_win-sdk\\include" -DLLVM_LIT="..\\llvm\\llvm\\utils\\lit\\lit.py" ${{ steps.cmake_opts.outputs.opts }}

  - name: Keep track of files after configuring E2E step
    if: ${{ !cancelled() && inputs.binaries_artifact != '' && inputs.testing_mode != 'run-only' }}
    shell: bash
    run: ls build-e2e > e2econf_files.txt

  # Composed here, not in ur-test, since these depend on caller-only workflow inputs.
  - name: Compose E2E LIT options
    id: lit_opts
    shell: bash
    env:
      TESTING_MODE: ${{ inputs.testing_mode }}
      TARGET_DEVICES: ${{ inputs.target_devices }}
      USER_LIT_OPTS: ${{ inputs.extra_lit_opts }}
      MAX_TIME: ${{ inputs.testing_mode == 'run-only' && 1200 || 3600 }}
    run: |
      # --timeout kills an individual hung test (e.g. a GPU driver hang) instead of
      # letting it block the whole suite until the job's own timeout-minutes fires.
      echo "opts=--max-time ${MAX_TIME} --timeout 600 --param print_features=True --param test-mode=${TESTING_MODE} --param sycl_devices=${TARGET_DEVICES} ${USER_LIT_OPTS}" >> "$GITHUB_OUTPUT"

  - name: Build artifact name
    if: ${{ always() && inputs.job_name != '' }}
    id: artifact_name
    shell: bash
    env:
      JOB_NAME: ${{ inputs.job_name }}
    run: |
      safe_name=$(echo "$JOB_NAME" | tr -c '[:alnum:]._-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
      echo "name=e2e-${safe_name}" >> "$GITHUB_OUTPUT"

  - name: Run E2E tests
    uses: ./devops/actions/run-tests/ur
    with:
      test_type: 'e2e'
      build_dir: 'build-e2e'
      extra_lit_opts: ${{ steps.lit_opts.outputs.opts }}
      artifact_name: ${{ steps.artifact_name.outputs.name }}

  # Github CI doesn't support containers on Windows, so we cannot guarantee
  # that paths are the same between building and running systems. To avoid
  # CMake issues related to absolute paths we reconfigure the build-e2e
  # folder on the run system.
  - name: Remove E2E configuration files
    if: ${{ !cancelled() && inputs.binaries_artifact != '' && inputs.testing_mode != 'run-only' }}
    shell: bash
    run: |
      for FILE in $(cat e2econf_files.txt); do rm -r build-e2e/$FILE; done
      rm e2econf_files.txt

  - name: Verify E2E binaries were built
    if: ${{ !cancelled() && inputs.binaries_artifact != '' && inputs.testing_mode != 'run-only' }}
    shell: bash
    run: |
      if [ -z "$(find build-e2e -path '*/Output/*' -type f -print -quit)" ]; then
        echo "::error::No compiled E2E test binaries found under build-e2e/**/Output/ after the build step. Refusing to upload a broken artifact."
        exit 1
      fi

  - name: Pack E2E test binaries
    if: ${{ !cancelled() && inputs.binaries_artifact != '' && inputs.testing_mode != 'run-only' }}
    shell: bash
    run: |
      tar -czf e2e_bin.tar.gz -C build-e2e .
  - name: Upload E2E test binaries
    if: ${{ !cancelled() && inputs.binaries_artifact != '' && inputs.testing_mode != 'run-only' }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: ${{ inputs.binaries_artifact }}
      path: e2e_bin.tar.gz
      retention-days: ${{ inputs.retention-days }}
  - name: Cleanup E2E tests
    if: ${{ !cancelled() }}
    shell: bash
    run: rm -rf build-e2e
