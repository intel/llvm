name: 'Cached checkout'
description: 'Checkout a git repository using local cache if possible'
inputs:
  repository:
    description: 'Repository name with owner'
    default: ${{ github.repository }}
  ref:
    description: 'Commit-ish to checkout'
  merge_ref:
    description: |
      Commit-ish to merge post-checkout if non-empty. Must be reachable from the
      default_branch input paramter.
    default: ''
  path:
    description: 'Path to checkout repo to'
  fetch-depth:
    description: 'Number of commits to fetch'
    default: 1
  cache_path:
    description: 'Path to cache location for all repos'
  default_branch:
    description: 'Name of the default branch'
    default: 'sycl'

runs:
  using: 'composite'
  steps:
  # Anonymous git-over-HTTPS to github.com is answered with HTTP 401 on some of
  # our runners ("could not read Username for 'https://github.com'"), which
  # breaks both the cache update below and the clones CMake's FetchContent does
  # later in the job (vc-intrinsics, level-zero, ...). Authenticate every
  # github.com fetch of this job with the workflow token, the same way
  # actions/checkout does. Exported via GITHUB_ENV rather than
  # `git config --global` so that no credential is left behind on these
  # persistent runners. Note that an `insteadOf` URL rewrite cannot be used
  # here: `git remote get-url` applies it, and llvm/cmake/modules/
  # VersionFromVCS.cmake rejects a remote URL carrying a credential.
  - name: Authenticate git for github.com
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      CREDENTIAL=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
      echo "::add-mask::$CREDENTIAL"
      echo "GIT_CONFIG_COUNT=1" >> $GITHUB_ENV
      echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader" >> $GITHUB_ENV
      echo "GIT_CONFIG_VALUE_0=Authorization: Basic $CREDENTIAL" >> $GITHUB_ENV
  - name: Fetch cache
    shell: bash
    run: |
      mkdir -p ${{ inputs.cache_path }}/${{ inputs.repository }}
      cd ${{ inputs.cache_path }}/${{ inputs.repository }}
      if [ -d ./.git ]; then
        git pull --prune --rebase
      else
        git clone https://github.com/${{ inputs.repository }}.git .
        git gc
      fi
  - name: Checkout
    env:
      GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ inputs.cache_path }}/${{ inputs.repository }}/.git/objects
      # actions/checkout brings its own credentials, don't stack a second
      # Authorization header on top of them.
      GIT_CONFIG_COUNT: 0
    uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    with:
      persist-credentials: false
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      path: ${{ inputs.path }}
      fetch-depth: 0
  - name: Setup alternates
    shell: bash
    env:
      GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ inputs.cache_path }}/${{ inputs.repository }}/.git/objects
    run: |
      echo $GIT_ALTERNATE_OBJECT_DIRECTORIES > ${{ inputs.path }}/.git/objects/info/alternates
  - name: Merge sycl HEAD into current branch
    shell: bash
    if: ${{ inputs.merge_ref != '' }}
    env:
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
    run: |
      cd ${{ inputs.path }}
      git fetch origin $DEFAULT_BRANCH
      echo "FETCHED:"
      git log -1 origin/$DEFAULT_BRANCH
      echo "Merging ${{ inputs.merge_ref }} into the current workspace"
      # Set fake identity to fulfil git requirements
      git config --local user.email "actions@github.com"
      git config --local user.name "GitHub Actions"
      git merge --no-ff --no-commit ${{ inputs.merge_ref }}
