# Our PVC runners don't have the userspace Vulkan driver installed
config.unsupported_features += ['arch-intel_gpu_pvc']

# Prebuilt libvulkan (e.g. 1.3.283) may need glibc newer than the host's
# (pow@GLIBC_2.29), which makes linking fail.
if 'linux' in config.available_features and config.vulkan_found == 'TRUE':
    import os, re
    try:
        host = tuple(map(int, os.confstr('CS_GNU_LIBC_VERSION').split()[1].split('.')[:2]))
        with open(os.path.realpath(config.vulkan_lib), 'rb') as f:
            needed = max(int(m) for m in re.findall(rb'GLIBC_2\.(\d+)', f.read()))
        if host < (2, needed):
            config.unsupported_features += ['linux']
    except (OSError, ValueError, IndexError):
        pass

if 'windows' in config.available_features:
   config.unsupported_features.remove('gpu-intel-dg2')
