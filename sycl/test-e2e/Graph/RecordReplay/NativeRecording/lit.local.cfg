# The command-buffer graph suite is currently disabled on Windows BMG.
# This undoes the exclusion for native recording only.
if 'windows' in config.available_features:
    bmg_arches = {'arch-intel_gpu_bmg_g21', 'arch-intel_gpu_bmg_g31'}
    config.unsupported_features = [
        feature for feature in config.unsupported_features if feature not in bmg_arches
    ]

# TODO: Remove this workaround once CI upgrades to L0 loader v1.34 on Windows
# which fixes counting of zeEventCounterBasedCreate with leak checking.
# The below regex matches any positive leak, or a negative leak on any destroy
# function except zeEventDestroy. Leak lines look like
# "<destroy function> = <count> ---> LEAK = <creates - destroys>":
#   LEAK = [^-]   positive leak on any function
#   [^y]          functions not ending in Destroy (zeMemFree, zeMemFreeExt)
#   [^t]Destroy   *Destroy not ending in tDestroy (e.g. zeKernelDestroy)
#   [^n]tDestroy  *tDestroy not ending in ntDestroy (zeContextDestroy,
#                 zeCommandListDestroy)
# zeEventDestroy ends in ntDestroy, so none of the alternatives match it.
# https://github.com/oneapi-src/level-zero/issues/512
if 'windows' in config.available_features:
    config.substitutions.append(
        (
            '%{leak_check_not}',
            '"{{LEAK = [^-]|([^y]|([^n]t|[^t])Destroy) = [0-9 ]+---> LEAK = -}}"',
        )
    )
else:
    config.substitutions.append(('%{leak_check_not}', 'LEAK'))
