# %{full_atomic_flags} are the extra flags needed for full atomic coverage
# (16/32/64-bit) on CRI devices. Tests build a second binary with them
# unconditionally (per-device features are not available on build lines) and
# run it only on CRI devices, see e.g. max.cpp.
config.substitutions.append(
    (
        "%{full_atomic_flags}",
        "-DFULL_ATOMIC16_COVERAGE -DFULL_ATOMIC32_COVERAGE "
        "-DFULL_ATOMIC64_COVERAGE -fsycl-device-code-split=per_kernel "
        "-Xspirv-translator=spir64 "
        "-spirv-ext=+SPV_KHR_bfloat16,+SPV_INTEL_16bit_atomics",
    )
)
