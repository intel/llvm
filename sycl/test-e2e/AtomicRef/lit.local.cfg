# %{build_atomic} is %{build} with the extra flags needed for full atomic
# coverage (16/32/64-bit) when the tests are run on a CRI device; on any other
# target it is plain %{build}.
cri_build_flags = (
    "-DFULL_ATOMIC16_COVERAGE -DFULL_ATOMIC32_COVERAGE -DFULL_ATOMIC64_COVERAGE "
    "-fsycl-device-code-split=per_kernel -Xspirv-translator=spir64 "
    "-spirv-ext=+SPV_KHR_bfloat16,+SPV_INTEL_16bit_atomics"
)

is_cri = any(
    "arch-intel_gpu_cri" in features
    for features in config.sycl_dev_features.values()
)

config.substitutions.append(
    ("%{build_atomic}", "%{build} " + cri_build_flags if is_cri else "%{build}")
)
