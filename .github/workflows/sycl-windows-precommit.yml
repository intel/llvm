name: SYCL Pre Commit on Windows

on:
  pull_request:
    branches:
    - sycl
    - llvmspirv_pulldown
    - sycl-rel-**
    # Do not run builds if changes are only in the following locations
    # Note: benchmark-related paths are the same as in sycl-ur-perf-benchmarking.yml (to run there instead)
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - '.github/CODEOWNERS'
    - 'sycl/cts_exclude_filter/**'
    - 'sycl/doc/**'
    - 'sycl/gdb/**'
    - 'clang/docs/**'
    - '**.md'
    - '**.rst'
    - '.github/workflows/sycl-linux-*.yml'
    - '.github/workflows/sycl-precommit-aws.yml'
    - '.github/workflows/sycl-macos-*.yml'
    - '.github/workflows/sycl-nightly.yml'
    - '.github/workflows/sycl-rel-nightly.yml'
    - '.github/workflows/sycl-rel-nightly-launch.yml'
    - '.github/workflows/sycl-trivy.yml'
    - '.github/workflows/sycl-coverity.yml'
    - '.github/workflows/sycl-weekly.yml'
    - 'devops/containers/**'
    - 'devops/actions/build_container/**'
    - 'devops/compat_ci_exclude.sycl-rel-6_2'
    - 'unified-runtime/examples/**'
    - 'unified-runtime/scripts/**'
    - 'unified-runtime/test/**'
    - 'unified-runtime/third_party/**'
    - 'unified-runtime/tools/**'
    - 'devops/scripts/benchmarks/**'
    - 'devops/actions/run-tests/benchmark/**'
    - '.github/workflows/sycl-ur-perf-benchmarking.yml'

permissions: read-all

concurrency:
  #  Cancel a currently running workflow from the same PR, branch or tag.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    uses: ./.github/workflows/sycl-detect-changes.yml

  build:
    needs: [detect_changes]
    if: |
      success()
      && github.repository == 'intel/llvm'
    uses: ./.github/workflows/sycl-windows-build.yml
    with:
      changes: ${{ needs.detect_changes.outputs.filters }}
      e2e_binaries_artifact: sycl_windows_e2ebin
      e2e_binaries_new_offload_model_artifact: sycl_windows_e2ebin_with_new_offload_model

  build_debug_runtime:
    name: Debug runtime (${{ matrix.loader }})
    needs: [detect_changes]
    if: success() && github.repository == 'intel/llvm'
    runs-on: [Windows, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: static-default
            configure_args: ''
          - loader: shared
            configure_args: '-DUR_STATIC_LOADER=OFF'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        sparse-checkout: |
          devops/actions
    - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64
    - name: Set env
      run: |
        git config --system core.longpaths true
        git config --global core.autocrlf false
        echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CCACHE_DIR=D:\github\_work\cache\debug-runtime-${{ matrix.loader }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CCACHE_MAXSIZE=10G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Register cleanup after job is finished
      uses: ./devops/actions/cleanup
    - uses: ./devops/actions/cached_checkout
      with:
        path: src
        ref: ${{ github.sha }}
        cache_path: "D:\\\\github\\\\_work\\\\repo_cache\\\\"
    - name: Configure Debug runtime
      shell: cmd
      env:
        ARGS: ${{ matrix.configure_args }}
      run: |
        mkdir build
        IF NOT EXIST D:\github\_work\cache\debug-runtime-${{ matrix.loader }} MKDIR D:\github\_work\cache\debug-runtime-${{ matrix.loader }}
        python.exe src/buildbot/configure.py -o build ^
          --ci-defaults --build-type Debug --disable-jit %ARGS% ^
          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
    - name: Build release-CRT and debug-CRT runtimes
      run: cmake --build build --target sycl-runtime-libraries unified-runtimed-build
    - name: Check both SYCL DLL variants were built
      shell: powershell
      run: |
        $dlls = Get-ChildItem build/bin -Filter 'sycl*.dll'
        if (-not ($dlls.Name -match '^sycl[0-9]+\.dll$')) {
          throw 'The release-CRT SYCL DLL was not built'
        }
        if (-not ($dlls.Name -match '^sycl[0-9]+d\.dll$')) {
          throw 'The debug-CRT SYCL DLL was not built'
        }

  run_prebuilt_e2e_tests:
    needs: build
    # Continue if build was successful.
    if: |
      !cancelled()
      && needs.build.outputs.build_conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel GEN12 Graphics with Level Zero
            runner: '["Windows","gen12"]'
          - name: Intel Arc Graphics with Level Zero
            runner: '["Windows","arc"]'
          - name: Intel Battlemage Graphics with Level Zero
            runner: '["Windows","bmg"]'
    uses: ./.github/workflows/sycl-windows-run-tests.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      target_devices: "level_zero:gpu"
      toolchain_artifact_filename: ${{ needs.build.outputs.toolchain_artifact_filename }}
      testing_mode: run-only
      binaries_artifact: sycl_windows_e2ebin

  run_prebuilt_e2e_with_new_offload_model_tests:
    needs: build
    # Continue if build was successful.
    if: |
      !cancelled() &&
      needs.build.outputs.build_conclusion == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'new-offload-model')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: New Offload Model / Intel GEN12 Graphics with Level Zero
            runner: '["Windows","gen12"]'
          - name: New Offload Model / Intel Arc Graphics with Level Zero
            runner: '["Windows","arc"]'
          - name: New Offload Model / Intel Battlemage Graphics with Level Zero
            runner: '["Windows","bmg"]'
    uses: ./.github/workflows/sycl-windows-run-tests.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      target_devices: "level_zero:gpu"
      toolchain_artifact_filename: ${{ needs.build.outputs.toolchain_artifact_filename }}
      testing_mode: run-only
      binaries_artifact: sycl_windows_e2ebin_with_new_offload_model
      extra_lit_opts: --param enable_new_offload_model=True
