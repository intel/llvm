name: SYCL Pre Commit on Linux

on:
  # We rely on "Fork pull request workflows from outside collaborators" -
  # "Require approval for all outside collaborators" at
  # https://github.com/intel/llvm/settings/actions for security.
  pull_request:
    branches:
    - sycl
    - sycl-rel-**
    # Do not run builds if changes are only in the following locations
    # Note: benchmark-related paths are the same as in sycl-ur-perf-benchmarking.yml (to run there instead)
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - '.github/CODEOWNERS'
    - 'sycl/cts_exclude_filter/**'
    - 'sycl/doc/**'
    - 'sycl/gdb/**'
    - 'clang/docs/**'
    - '**.md'
    - '**.rst'
    - '.github/workflows/sycl-windows-*.yml'
    - '.github/workflows/sycl-macos-*.yml'
    - '.github/workflows/sycl-nightly.yml'
    - '.github/workflows/sycl-rel-nightly.yml'
    - '.github/workflows/sycl-rel-nightly-launch.yml'
    - '.github/workflows/sycl-trivy.yml'
    - '.github/workflows/sycl-coverity.yml'
    - '.github/workflows/sycl-weekly.yml'
    - 'devops/containers/**'
    - 'devops/actions/build_container/**'
    - 'unified-runtime/examples/**'
    - 'unified-runtime/scripts/**'
    - 'unified-runtime/test/**'
    - 'unified-runtime/third_party/**'
    - 'unified-runtime/tools/**'
    - 'devops/scripts/benchmarks/**'
    - 'devops/actions/run-tests/benchmark/**'
    - '.github/workflows/sycl-ur-perf-benchmarking.yml'

concurrency:
  #  Cancel a currently running workflow from the same PR, branch or tag.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  detect_changes:
    uses: ./.github/workflows/sycl-detect-changes.yml

  build:
    name: Self build
    needs: [detect_changes]
    uses: ./.github/workflows/sycl-linux-build.yml
    with:
      build_ref: ${{ github.sha }}
      build_cache_root: "/__w/"
      build_cache_suffix: "default"
      # Docker image has last nightly pre-installed and added to the PATH
      build_image: "ghcr.io/intel/llvm/sycl_ubuntu2404_nightly:latest"
      cc: clang
      cxx: clang++
      changes: ${{ needs.detect_changes.outputs.filters }}

      toolchain_artifact: sycl_linux_default
      e2e_binaries_artifact: e2e_bin
      e2e_binaries_preview_artifact: e2e_bin_preview
      e2e_binaries_new_offload_model_artifact: e2e_bin_new_offload_model

  # DEBUG: Temporarily restricted to run only
  # sycl/test-e2e/Adapters/max_malloc.cpp on a single runner, to reproduce/
  # verify that test in isolation. Should be reverted afterwards.
  E2E:
    needs: [build, detect_changes]
    if: ${{ !cancelled() && needs.build.outputs.build_conclusion == 'success' }}
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel / GEN 12 Integrated
            runner: '["Linux", "gen12"]'
            target_devices: level_zero:gpu;opencl:gpu;opencl:cpu
            # DEBUG: Only run Adapters/max_malloc.cpp.
            env: '{"LIT_FILTER":"Adapters/max_malloc.cpp"}'

    uses: ./.github/workflows/sycl-linux-run-tests.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      image_options: ${{ matrix.image_options || '-u 1001 --device=/dev/dri -v /dev/dri/by-path:/dev/dri/by-path --privileged --cap-add SYS_ADMIN' }}
      target_devices: ${{ matrix.target_devices }}
      extra_lit_opts: ${{ matrix.extra_lit_opts }}
      repo_ref: ${{ github.sha }}
      toolchain_artifact: ${{ needs.build.outputs.toolchain_artifact }}
      toolchain_artifact_filename: ${{ needs.build.outputs.toolchain_artifact_filename }}
      toolchain_decompress_command: ${{ needs.build.outputs.toolchain_decompress_command }}
      binaries_artifact: ${{ matrix.binaries_artifact || 'e2e_bin' }}
      testing_mode: 'run-only'

      # Do not install drivers on AMD and CUDA runners.
      install_igc_driver: >-
        ${{ !contains(matrix.target_devices, 'cuda') &&
        !contains(matrix.target_devices, 'hip') &&
        contains(needs.detect_changes.outputs.filters, 'drivers') }}
      skip_run: ${{ matrix.skip_run || 'false' }}
      env: ${{ matrix.env || (contains(needs.detect_changes.outputs.filters, 'esimd') && '{}' || '{"LIT_FILTER_OUT":"ESIMD/"}') }}
